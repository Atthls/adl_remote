<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Remote Crane Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="remote" class="remote hidden" aria-hidden="true">
    <img class="remote-shell" src="assets/remote_shell.png" alt="Control remoto de cesta" />

    <div id="buttons-layer" class="buttons-layer" aria-hidden="true">
      <img class="remote-icon icon-start" src="assets/start.png" alt="" />
      <img id="btn-up" class="remote-button button-up" src="assets/up.png" alt="" />
      <img id="btn-west" class="remote-button button-west" src="assets/west.png" alt="" />
      <img id="btn-east" class="remote-button button-east" src="assets/east.png" alt="" />
      <img id="btn-down" class="remote-button button-down" src="assets/down.png" alt="" />
      <img class="remote-icon icon-stop" src="assets/stop.png" alt="" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
